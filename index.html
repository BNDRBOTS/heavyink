<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Heavy Ink</title>
  <style>
    /* Absolute minimal reset. No bloat. */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000; /* True black */
      overflow: hidden;
      font-family: sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. Setup the basic scene
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    // Orthographic camera because we are doing 2D plane manipulation
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
    container.appendChild(renderer.domElement);

    // 2. Generate crisp typography via hidden 2D Canvas
    function createTextTexture() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 2048; // High res for sharp edges
      canvas.width = size;
      canvas.height = size;

      // True black background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, size, size);

      // Stark white text
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Calculate font size relative to canvas
      ctx.font = 'bold 300px Arial, sans-serif';
      ctx.fillText('HEAVY INK', size / 2, size / 2);

      const texture = new THREE.CanvasTexture(canvas);
      // Ensure infinite black edges, preventing any repeating artifacts on mobile scaling or edge distortion
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    // 3. Custom GLSL Shader Material
    const textTexture = createTextTexture();
    
    const uniforms = {
      uTime: { value: 0.0 },
      uTexture: { value: textTexture },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uHoverState: { value: 0.0 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform sampler2D uTexture;
        uniform vec2 uMouse;
        uniform vec2 uResolution;
        uniform float uHoverState;

        varying vec2 vUv;

        void main() {
          // Normalize mouse coordinates to match UV space
          vec2 mouseUV = uMouse;
          mouseUV.y = 1.0 - mouseUV.y; 

          vec2 uv = vUv;
          float aspect = uResolution.x / uResolution.y;

          // Mobile-first responsive layout (un-squish typography dynamically)
          if (aspect < 1.0) {
            // Replicate the exact visual presence and desktop-weight on portrait devices
            float scaleY = 1.77 / aspect; 
            uv.y = (uv.y - 0.5) * scaleY + 0.5;
          }

          // Compute aspect-corrected distance so touch targets are circular and accurate
          vec2 distUV = vUv;
          vec2 distMouse = mouseUV;
          if (aspect < 1.0) {
              distUV.x *= aspect;
              distMouse.x *= aspect;
          }

          float dist = distance(distUV, distMouse);
          
          // Create a smooth, heavy magnetic distortion field
          // Increase effect radius massively on mobile for native feeling thumb zones
          float effectRadius = aspect < 1.0 ? 0.4 : 0.25;
          float strength = smoothstep(effectRadius, 0.0, dist) * 0.15;
          
          // Add organic liquid math perfectly scaled to physical pixels on mobile
          vec2 distortion = vec2(
            sin(vUv.y * 20.0 + uTime * 2.0) * strength,
            cos(distUV.x * 20.0 + uTime * 2.0) * strength
          );

          // Apply distortion pushing outward from the cursor natively in screen space
          vec2 dir = distUV - distMouse;
          // Prevent NaN artifacts by checking length safely
          float len = length(dir);
          if (len > 0.0) {
              dir /= len; // normalize
          } else {
              dir = vec2(0.0);
          }
          
          // Map direction back to original UV space before applying strength
          if (aspect < 1.0) {
              dir.x /= aspect;
              // Re-normalize so the push force is visually equal in all physical directions
              float nLen = length(dir);
              if (nLen > 0.0) dir /= nLen;
          }

          vec2 finalUV = uv + dir * strength + distortion;

          // Slight chromatic split for premium feel (Desktop untouched, mobile perfectly scaled)
          float r = texture2D(uTexture, finalUV + vec2(strength * 0.1, 0.0)).r;
          float g = texture2D(uTexture, finalUV).g;
          float b = texture2D(uTexture, finalUV - vec2(strength * 0.1, 0.0)).b;

          gl_FragColor = vec4(r, g, b, 1.0);
        }
      `
    });

    // 4. Geometry and Mesh
    const geometry = new THREE.PlaneGeometry(2, 2);
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    // 5. Track Mouse/Touch Variables
    let targetMouse = new THREE.Vector2(0.5, 0.5);
    let currentMouse = new THREE.Vector2(0.5, 0.5);

    function updatePointer(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      // Calculate precise position relative to the actual rendered canvas
      let x = (clientX - rect.left) / rect.width;
      let y = (clientY - rect.top) / rect.height;
      // Clamp to ensure it doesn't go out of bounds if touch leaves canvas
      targetMouse.x = Math.max(0, Math.min(1, x));
      targetMouse.y = Math.max(0, Math.min(1, y));
    }

    window.addEventListener('mousemove', (e) => {
      updatePointer(e.clientX, e.clientY);
    });

    // Touch input — enhanced for zero-friction mobile tracking
    function handleTouch(e) {
      if (e.cancelable) e.preventDefault();
      if (e.touches.length > 0) {
        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }

    window.addEventListener('touchstart', handleTouch, { passive: false });
    window.addEventListener('touchmove', handleTouch, { passive: false });
    
    // Prevent any native gestures or bounce on document
    document.addEventListener('touchmove', (e) => {
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    // 6. Handle resizing seamlessly with Visual Viewport for native mobile feel
    function onResize() {
      const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      
      renderer.setSize(width, height);
      uniforms.uResolution.value.set(width, height);
    }

    window.addEventListener('resize', onResize);

    // Visual viewport resize covers iOS Safari URL bar show/hide flawlessly
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    
    // Initialize correct size immediately
    onResize();

    // 7. Render Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      // Smooth mouse interpolation (lerp) for buttery feel
      currentMouse.lerp(targetMouse, 0.08);
      uniforms.uMouse.value.copy(currentMouse);
      
      uniforms.uTime.value = clock.getElapsedTime();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
