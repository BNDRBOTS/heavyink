<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heavy Ink</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: sans-serif;
      /* Jobs-grade mobile touch isolation */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Responsive Typography Engine
    function createTextTexture() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 2048; 
      canvas.width = size;
      canvas.height = size;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const aspect = window.innerWidth / window.innerHeight;

      // Mobile layout reflow for thumb-zone readability
      if (aspect < 0.85) {
        ctx.font = 'bold 360px Arial, sans-serif';
        ctx.fillText('HEAVY', size / 2, size / 2 - 190);
        ctx.fillText('INK', size / 2, size / 2 + 190);
      } else {
        ctx.font = 'bold 300px Arial, sans-serif';
        ctx.fillText('HEAVY INK', size / 2, size / 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      return texture;
    }

    const uniforms = {
      uTime: { value: 0.0 },
      uTexture: { value: createTextTexture() },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform sampler2D uTexture;
        uniform vec2 uMouse;
        uniform vec2 uResolution;

        varying vec2 vUv;

        void main() {
          vec2 mouseUV = uMouse;
          mouseUV.y = 1.0 - mouseUV.y; 

          // Normalized physics math: perfect circular fields across all devices
          vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);
          float dist = distance(vUv * aspect, mouseUV * aspect);
          
          float effectRadius = 0.25;
          float strength = smoothstep(effectRadius, 0.0, dist) * 0.15;
          
          vec2 distortion = vec2(
            sin(vUv.y * 20.0 + uTime * 2.0) * strength,
            cos(vUv.x * 20.0 + uTime * 2.0) * strength
          );

          // Aspect-corrected directional vector for uniform magnetic push
          vec2 dir = normalize((vUv - mouseUV) * aspect);
          dir = dir / aspect; 
          
          vec2 finalUV = vUv + dir * strength + distortion;

          float r = texture2D(uTexture, finalUV + vec2(strength * 0.1, 0.0)).r;
          float g = texture2D(uTexture, finalUV).g;
          float b = texture2D(uTexture, finalUV - vec2(strength * 0.1, 0.0)).b;

          gl_FragColor = vec4(r, g, b, 1.0);
        }
      `
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    let targetMouse = new THREE.Vector2(0.5, 0.5);
    let currentMouse = new THREE.Vector2(0.5, 0.5);

    // Frictionless IO mapping
    const updatePointer = (clientX, clientY) => {
      targetMouse.x = clientX / window.innerWidth;
      targetMouse.y = clientY / window.innerHeight;
    };

    window.addEventListener('mousemove', (e) => {
      updatePointer(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
      updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault(); // Prevents iOS pull-to-refresh & scroll leakage
      updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      
      const oldTexture = uniforms.uTexture.value;
      uniforms.uTexture.value = createTextTexture();
      oldTexture.dispose();
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      currentMouse.lerp(targetMouse, 0.08);
      uniforms.uMouse.value.copy(currentMouse);
      
      uniforms.uTime.value = clock.getElapsedTime();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
