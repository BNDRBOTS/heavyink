<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heavy Ink</title>
  <style>
    /* Absolute minimal reset. No bloat. */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000; /* True black */
      overflow: hidden;
      font-family: sans-serif;
    }
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. Setup the basic scene
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    // Orthographic camera because we are doing 2D plane manipulation
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
    container.appendChild(renderer.domElement);

    // 2. Generate crisp typography via hidden 2D Canvas
    function createTextTexture() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 2048; // High res for sharp edges
      canvas.width = size;
      canvas.height = size;

      // True black background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, size, size);

      // Stark white text
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Calculate font size relative to canvas
      ctx.font = 'bold 300px Arial, sans-serif';
      ctx.fillText('HEAVY INK', size / 2, size / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    // 3. Custom GLSL Shader Material
    const textTexture = createTextTexture();
    
    const uniforms = {
      uTime: { value: 0.0 },
      uTexture: { value: textTexture },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uHoverState: { value: 0.0 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform sampler2D uTexture;
        uniform vec2 uMouse;
        uniform vec2 uResolution;
        uniform float uHoverState;

        varying vec2 vUv;

        void main() {
          // Normalize mouse coordinates to match UV space
          vec2 mouseUV = uMouse;
          mouseUV.y = 1.0 - mouseUV.y; 

          // Calculate distance from current pixel to mouse
          float dist = distance(vUv, mouseUV);
          
          // Create a smooth, heavy magnetic distortion field
          float effectRadius = 0.25;
          float strength = smoothstep(effectRadius, 0.0, dist) * 0.15;
          
          // Add organic liquid math
          vec2 distortion = vec2(
            sin(vUv.y * 20.0 + uTime * 2.0) * strength,
            cos(vUv.x * 20.0 + uTime * 2.0) * strength
          );

          // Apply distortion pushing outward from the cursor
          vec2 dir = normalize(vUv - mouseUV);
          vec2 finalUV = vUv + dir * strength + distortion;

          // Slight chromatic split for premium feel
          float r = texture2D(uTexture, finalUV + vec2(strength * 0.1, 0.0)).r;
          float g = texture2D(uTexture, finalUV).g;
          float b = texture2D(uTexture, finalUV - vec2(strength * 0.1, 0.0)).b;

          gl_FragColor = vec4(r, g, b, 1.0);
        }
      `
    });

    // 4. Geometry and Mesh
    const geometry = new THREE.PlaneGeometry(2, 2);
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    // 5. Track Mouse Variables
    let targetMouse = new THREE.Vector2(0.5, 0.5);
    let currentMouse = new THREE.Vector2(0.5, 0.5);

    window.addEventListener('mousemove', (e) => {
      targetMouse.x = e.clientX / window.innerWidth;
      targetMouse.y = e.clientY / window.innerHeight;
    });

    // 6. Handle resizing seamlessly
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    });

    // 7. Render Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      // Smooth mouse interpolation (lerp) for buttery feel
      currentMouse.lerp(targetMouse, 0.08);
      uniforms.uMouse.value.copy(currentMouse);
      
      uniforms.uTime.value = clock.getElapsedTime();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
